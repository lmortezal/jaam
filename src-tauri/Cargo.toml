[package]
name = "opsportal"
version = "0.1.0"
description = "Private infrastructure knowledge base and launcher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.38", features = ["bundled-sqlcipher-vendored-openssl"] }
rand = "0.8"
zeroize = "1"
url = "2"
shlex = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
