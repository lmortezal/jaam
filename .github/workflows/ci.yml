name: Release & Verify

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev rpm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:native -- --locked
      - name: Browser workflow tests
        if: runner.os == 'Linux'
        run: |
          npm exec -- playwright install --with-deps chromium
          npm run test:e2e
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          npm run bundle -- --bundles app dmg -- --locked
          tar -czf src-tauri/target/release/bundle/macos/OpsPortal_0.1.0_macOS.app.tar.gz -C src-tauri/target/release/bundle/macos OpsPortal.app
      - name: Package Linux
        if: runner.os == 'Linux'
        run: npm run bundle -- --bundles deb rpm -- --locked
      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.rpm
          generate_release_notes: true
